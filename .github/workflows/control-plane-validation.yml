name: Control Plane Validation

on:
  pull_request:
    paths:
      - "src/server/controlPlane/**"
      - "tests/controlPlaneRegistry.test.ts"
      - "tests/taskEvidenceLedger.test.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/control-plane-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Registry and evidence tests
        run: npm run test:control-plane
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
